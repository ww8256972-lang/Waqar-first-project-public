<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Download Waqar Institute ERP App</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:2rem;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh}
    .card{max-width:480px;width:100%;background:#1e293b;border-radius:16px;padding:2rem;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.4)}
    h1{margin-top:0;color:#38bdf8}
    a.btn{display:inline-block;margin-top:1.5rem;padding:.9rem 1.6rem;background:#22c55e;color:#0f172a;font-weight:700;border-radius:10px;text-decoration:none}
    p{color:#94a3b8}
  </style>
</head>
<body>
  <div class="card">
    <h1>Waqar Computer Institute</h1>
    <p>Download the latest signed Release APK of the Waqar Institute ERP Android app.</p>
    <a class="btn" href="/apk/app-release.apk" download>Download Latest APK</a>
    <p style="margin-top:1.5rem;font-size:.85rem">If download does not start, long-press the button and choose "Save link as".</p>
  </div>
  <script>
    // Auto-trigger download on page load
    window.addEventListener('load', function () {
      const a = document.createElement('a');
      a.href = '/apk/app-release.apk';
      a.download = 'app-release.apk';
      document.body.appendChild(a);
      a.click();
      a.remove();
    });
  </script>
</body>
</html>
