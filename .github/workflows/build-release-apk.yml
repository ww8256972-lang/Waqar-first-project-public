name: Build & Sign Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_TOOL_OPTIONS: "-Dfile.encoding=UTF-8 -Djava.awt.headless=true"

jobs:
  build-release:
    name: Build Signed Release APK & Upload Artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Static Guardrails & Zero-Violation Verifier
        run: |
          chmod +x scripts/verify_static_guardrails.py
          python3 scripts/verify_static_guardrails.py

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 11076708
          packages: 'cmdline-tools;latest platform-tools'
          accept-android-sdk-licenses: true

      - name: Accept SDK Licenses & Install Android 36 SDK Packages
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(which sdkmanager 2>/dev/null || find "${ANDROID_SDK_ROOT}" -name sdkmanager | head -n 1)"
          fi
          yes | "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-36" \
            "platforms;android-36.1" \
            "build-tools;36.0.0" \
            "cmake;3.22.1" \
            "ndk;27.0.12077973"

      - name: Set up Gradle 9.3.1 with Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
          cache-read-only: false

      - name: Setup Signing Keystore & Configuration
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          EFF_STORE_PASS="${RELEASE_STORE_PASSWORD:-waqar_release_pass}"
          EFF_KEY_PASS="${RELEASE_KEY_PASSWORD:-waqar_release_pass}"
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > my-upload-key.jks
          else
            echo "Generating build upload keystore for release artifact packaging..."
            keytool -genkeypair -v \
              -keystore my-upload-key.jks \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$EFF_STORE_PASS" \
              -keypass "$EFF_KEY_PASS" \
              -dname "CN=Waqar Computer Institute, OU=Engineering, O=WCI, L=Unnao, ST=Uttar Pradesh, C=IN"
          fi

          echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/my-upload-key.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=${EFF_STORE_PASS}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${EFF_KEY_PASS}" >> "$GITHUB_ENV"

      - name: Build Release APK
        run: |
          gradle :app:assembleRelease -PenableNativeCxxBuild=true --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: waqar-institute-release-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Stage Release APK for Firebase Hosting
        run: |
          mkdir -p public/apk
          RELEASE_APK="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          cp "$RELEASE_APK" public/apk/app-release.apk
          ls -lh public/apk/app-release.apk

      - name: Deploy Hosting (APK + verify pages) to Firebase
        if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: default
